name: Build

on:
  push:
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of the draft release to build and publish
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve draft release
        if: github.event_name == 'workflow_dispatch'
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          json=$(gh release view "$TAG" --repo "$GH_REPO" --json isDraft,targetCommitish)
          if [ "$(jq -r .isDraft <<<"$json")" != "true" ]; then
            echo "Release $TAG is not a draft" >&2
            exit 1
          fi
          echo "ref=$(jq -r .targetCommitish <<<"$json")" >> "$GITHUB_OUTPUT"
      
      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.rel.outputs.ref || github.sha }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Build multi-file (dev) distribution
        run: |
          mkdir -p dist/dev/filecarton/public
          cp -r apps/backend/* dist/dev/
          cp -r apps/frontend/dist/. dist/dev/filecarton/public/

      - name: Build single-file distribution
        run: |
          php scripts/compile_single_file.php
          cp apps/backend/filecarton.config.php dist/singlefile/

      - name: Create ZIP archives
        run: |
          (cd dist/dev  && zip -r ../../filecarton-dev.zip .)
          (cd dist/singlefile && zip -r ../../filecarton-singlefile.zip .)

      - uses: actions/upload-artifact@v7
        with:
          path: filecarton-singlefile.zip
          archive: false
      - uses: actions/upload-artifact@v7
        with:
          path: filecarton-dev.zip
          archive: false

      - name: Upload release assets & publish
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            filecarton-singlefile.zip \
            filecarton-dev.zip \
            --clobber
          gh release edit "${{ inputs.tag }}" --draft=false
