; Apache uses this file. bootstrap.php clears max_execution_time for the
; seed copy, then replaces itself with Apache, which keeps the 120s limit.
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 32M
max_execution_time = 120
opcache.enable = 1
opcache.validate_timestamps = 0
session.cookie_httponly = 1
session.cookie_samesite = Lax
